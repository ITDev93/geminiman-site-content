    <circle cx="861" cy="53" r="6" fill="#f3d6a5"/>
    <circle cx="975" cy="116" r="8" fill="#b99cff"/>
    <circle cx="904" cy="217" r="11" fill="#8cbcf2"/>
    <circle cx="771" cy="195" r="6" fill="#f3d6a5"/>
    <circle cx="861" cy="53" r="14" fill="none" stroke="#f3d6a5" stroke-opacity=".28"/>
    <circle cx="904" cy="217" r="21" fill="none" stroke="#8cbcf2" stroke-opacity=".2"/>
  </g>
  <path d="M729 263H987" stroke="#adc7f9" stroke-opacity=".15"/>
  <text x="990" y="267" fill="#92a2c8" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" text-anchor="end">ALWAYS EVOLVING</text>
